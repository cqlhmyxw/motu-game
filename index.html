<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="墨兔冲关">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-152.png">
<title>墨兔冲关</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1410;font-family:'KaiTi','STKaiti',serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#a8b0bc;box-shadow:0 0 30px rgba(0,0,0,.6)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
#startScreen{background:radial-gradient(ellipse at center,rgba(20,16,10,.9),rgba(8,6,4,.96));pointer-events:auto}
#startScreen h1{font-size:min(13vw,58px);color:#c8a870;letter-spacing:14px;margin:0 0 6px;text-shadow:0 0 24px rgba(200,168,112,.4),0 3px 0 rgba(0,0,0,.5)}
.sub{font-size:13px;color:#8b7355;letter-spacing:5px;margin-bottom:24px}
.best-txt{font-size:15px;color:#d4c5a0;margin-bottom:24px}
.btn{padding:12px 40px;background:linear-gradient(180deg,#3a1e10,#2a140a);border:1px solid #8b1a1a;color:#c8a870;font:18px 'KaiTi',serif;letter-spacing:8px;cursor:pointer;border-radius:4px;box-shadow:0 0 16px rgba(139,26,26,.3);transition:filter .2s}
.btn:hover{filter:brightness(1.2)}
.howto{margin-top:28px;font-size:12px;color:#6a5a3a;letter-spacing:3px;line-height:2.4;text-align:center}
#overScreen{background:rgba(10,8,5,.88);pointer-events:auto;display:none}
#overScreen h2{font-size:34px;color:#8b1a1a;letter-spacing:10px;margin:0 0 16px}
#overScreen .st{font-size:17px;color:#d4c5a0;line-height:2;text-align:center;margin-bottom:22px;letter-spacing:2px}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;z-index:4;pointer-events:none}
#hud .l{font-size:24px;color:#2a1a1a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
#hud .r{font-size:15px;color:#4a3a2a;align-self:flex-end}
#combo{position:absolute;top:70px;left:0;right:0;text-align:center;font-size:24px;color:#8b1a1a;letter-spacing:4px;opacity:0;transition:opacity .3s;z-index:4;pointer-events:none}
#combo.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="420" height="680"></canvas>
  <div id="hud" style="display:none">
    <div class="l" id="scoreTxt">0</div>
    <div class="r" id="bestTxt">最高 0</div>
  </div>
  <div id="combo"></div>
  <div class="layer" id="startScreen">
    <h1>墨兔冲关</h1>
    <div class="sub">— 竹 林 穿 行 · 墨 点 收 缘 —</div>
    <div class="best-txt" id="startBest"></div>
    <button class="btn" id="startBtn">入 林</button>
    <div class="howto">点击 / 空格 — 跳跃<br>收集 金元宝(分) · 墨珠(连击) · 符纸(护身)<br>竹林渐密 兔息渐急</div>
  </div>
  <div class="layer" id="overScreen">
    <h2>兔 落 竹 深</h2>
    <div class="st" id="overStats"></div>
    <button class="btn" id="retryBtn">再 闯</button>
  </div>
</div>
<script>
(() => {
'use strict';
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=420,H=680;
const $=id=>document.getElementById(id);
const scoreTxt=$('scoreTxt'),bestTxt=$('bestTxt'),comboEl=$('combo'),hud=$('hud');
const startScreen=$('startScreen'),overScreen=$('overScreen');

// 存档
const SAVE_KEY='***';
function loadBest(){ try{return +localStorage.getItem(SAVE_KEY)||0}catch(_){return 0} }
function saveBest(v){ try{localStorage.setItem(SAVE_KEY,v)}catch(_){} }
let best=loadBest();
$('startBest').textContent = best?('最高分 '+best):'';

// 音效 (WebAudio 合成)
let AC=null;
function beep(f,d,t,v){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=t||'sine';o.frequency.value=f; g.gain.setValueAtTime(v||0.1,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d); o.connect(g);g.connect(AC.destination); o.start();o.stop(AC.currentTime+d);}catch(_){} }
const sfx={ jump:()=>{beep(392,.1,'triangle',.08);beep(523,.1,'triangle',.05);}, coin:()=>{beep(880,.08,'square',.05);beep(1175,.12,'square',.05);}, pearl:()=>{beep(660,.15,'sine',.08);}, die:()=>{beep(220,.25,'sawtooth',.1);beep(110,.4,'sawtooth',.1);}, pass:()=>{beep(494,.06,'sine',.05);} };

// 状态
let st='menu', rabbit, bamboo, pickups, particles, clouds, score, lastSpawn, shake, dayPhase, invincible;
let comboN=0, comboTimer=0;
const G=0.42, JUMP=-7.6, RR=13;
function vib(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch(_){} }

function reset(){
  rabbit={x:90,y:H*0.42,v:0,rot:0};
  bamboo=[]; pickups=[]; particles=[]; clouds=[];
  for(let i=0;i<4;i++) clouds.push({x:Math.random()*W,y:40+Math.random()*160,s:0.15+Math.random()*0.2,w:60+Math.random()*80});
  score=0; lastSpawn=0; shake=0; dayPhase=0; invincible=0; comboN=0; comboTimer=0;
  scoreTxt.textContent='0'; bestTxt.textContent='最高 '+best;
}
function diff(){ const d=Math.min(score,60); return {speed:2.1+d*0.045, gap:190-d*1.6, interval:Math.max(150-d*1.1,95)}; }
function spawnBamboo(){
  const D=diff();
  const gapY=90+Math.random()*(H-180-D.gap);
  bamboo.push({x:W+40,w:52,gapY:gapY+D.gap/2,gap:D.gap,passed:false,move:score>=30&&Math.random()<0.5,ph:Math.random()*6.28});
  if(st==='play'){
    const r=Math.random();
    if(r<0.6){ for(let i=0;i<3;i++) pickups.push({x:W+40+26,y:gapY+D.gap/2+(i-1)*34,kind:'coin',ph:Math.random()*6}); }
    else if(r<0.78){ pickups.push({x:W+40+26,y:gapY-46,kind:'pearl',ph:0}); }
    else if(r<0.86){ pickups.push({x:W+40+26,y:gapY+D.gap/2,kind:'shield',ph:0}); }
  }
}
function hasShield(){ return rabbit&&rabbit.shield; }

function update(dt,now){
  const D=diff();
  rabbit.v+=G; rabbit.y+=rabbit.v;
  rabbit.rot=Math.max(-0.5,Math.min(1.1,rabbit.v*0.06));
  if(rabbit.y<RR){rabbit.y=RR;rabbit.v=0;}
  if(rabbit.y>H-RR){hit();return;}
  lastSpawn+=D.speed;
  if(lastSpawn>D.interval+60){lastSpawn=0;spawnBamboo();}
  for(let i=bamboo.length-1;i>=0;i--){
    const b=bamboo[i]; b.x-=D.speed;
    if(b.move){ const minY=70+b.gap/2, maxY=H-70-b.gap/2; b.gapY+=Math.sin((now||performance.now())*0.002+b.ph)*0.7; if(b.gapY<minY)b.gapY=minY; if(b.gapY>maxY)b.gapY=maxY; }
    if(!b.passed&&b.x+b.w<rabbit.x-RR){b.passed=true;score++;scoreTxt.textContent=score;sfx.pass();dayPhase=(score%40)/40;}
    if(rabbit.x+RR>b.x&&rabbit.x-RR<b.x+b.w){
      if(rabbit.y-RR<b.gapY-b.gap/2||rabbit.y+RR>b.gapY+b.gap/2){
        if(hasShield()&&invincible<=0){rabbit.shield=false;invincible=24;sfx.pearl();puff(rabbit.x,rabbit.y,'#e8c040',14);}
        else{hit();return;}
      }
    }
    if(b.x+b.w<-20)bamboo.splice(i,1);
  }
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i]; p.x-=D.speed; p.ph+=0.1;
    const dx=p.x-rabbit.x,dy=p.y-rabbit.y;
    if(dx*dx+dy*dy<(RR+11)*(RR+11)){
      if(p.kind==='coin'){ comboN++; comboTimer=90; const gain=1+Math.floor(comboN/5); score+=gain; scoreTxt.textContent=score; sfx.coin(); vib(15); puff(p.x,p.y,'#e8c040',8); floatText(p.x,p.y-14,'+'+gain); if(comboN>=5)showCombo('连击 ×'+comboN+'  +'+gain); }
      else if(p.kind==='pearl'){ score+=5;comboN+=3;comboTimer=120;scoreTxt.textContent=score;sfx.pearl();vib(25);puff(p.x,p.y,'#4a5568',12);floatText(p.x,p.y-14,'+5');showCombo('墨珠 +5'); }
      else if(p.kind==='shield'){ rabbit.shield=true;sfx.pearl();vib(30);puff(p.x,p.y,'#9a3a2a',12);showCombo('符纸护身'); }
      pickups.splice(i,1); continue;
    }
    if(p.x<-20)pickups.splice(i,1);
  }
  if(comboTimer>0){comboTimer--;if(comboTimer===0)comboN=0;}
  if(invincible>0)invincible--;
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;if(!q.txt)q.vy+=0.12;q.life--;if(q.life<=0)particles.splice(i,1);}
  clouds.forEach(c=>{c.x-=c.s;if(c.x<-c.w)c.x=W+c.w;});
  if(shake>0)shake--;
}
function hit(){ sfx.die(); vib([40,30,90]); shake=16; puff(rabbit.x,rabbit.y,'#2a2a2a',22); st='dead'; setTimeout(showOver,700); }
function puff(x,y,col,n){ for(let i=0;i<n;i++){const a=Math.random()*6.2832,s=1+Math.random()*3.4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:18+Math.random()*22,r:2+Math.random()*4,col});} }
function floatText(x,y,txt){ particles.push({x,y,vx:0,vy:-1.1,life:34,txt,col:'#8b6a1a'}); }
let comboHideT=0;
function showCombo(txt){ comboEl.textContent=txt; comboEl.classList.add('show'); clearTimeout(comboHideT); comboHideT=setTimeout(()=>comboEl.classList.remove('show'),900); }

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*.8,(Math.random()-.5)*shake*.8);
  const stops=[[168,176,188],[200,205,212],[210,170,130],[60,62,86]];
  const f=dayPhase*4,i=f|0,k=f-i; const a=stops[i%4],b=stops[(i+1)%4];
  const sky='rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')+')';
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,sky); g.addColorStop(1,'#d9cfc0');
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(60,66,86,0.28)';
  ctx.beginPath(); ctx.moveTo(-20,H*0.62);
  for(let x=-20;x<=W+20;x+=34)ctx.lineTo(x,H*0.62-Math.sin(x*0.021+1.7)*40-Math.sin(x*0.043)*18);
  ctx.lineTo(W+20,H); ctx.lineTo(-20,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(245,240,232,0.5)';
  clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*0.5,14,0,0,6.2832);ctx.fill();});
  bamboo.forEach(b=>{
    const topH=b.gapY-b.gap/2,botY=b.gapY+b.gap/2;
    ctx.fillStyle='#3d5a42'; ctx.fillRect(b.x,0,b.w,topH); ctx.fillRect(b.x,botY,b.w,H-botY);
    ctx.fillStyle='rgba(20,40,24,0.45)';
    for(let y=18;y<topH-8;y+=44)ctx.fillRect(b.x,y,b.w,5);
    for(let y=botY+26;y<H-8;y+=44)ctx.fillRect(b.x,y,b.w,5);
    ctx.fillStyle='rgba(200,220,190,0.18)'; ctx.fillRect(b.x+6,0,7,topH); ctx.fillRect(b.x+6,botY,7,H-botY);
  });
  pickups.forEach(p=>{
    const bob=Math.sin(p.ph)*3;
    if(p.kind==='coin'){ ctx.fillStyle='#e8c040';ctx.strokeStyle='#8b6a1a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y+bob,9,0,6.2832);ctx.fill();ctx.stroke(); }
    else if(p.kind==='pearl'){ ctx.fillStyle='#2a2f3a';ctx.beginPath();ctx.arc(p.x,p.y+bob,10,0,6.2832);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.55)';ctx.beginPath();ctx.arc(p.x-3,p.y+bob-3,3,0,6.2832);ctx.fill(); }
    else { ctx.fillStyle='#f2e6c8';ctx.strokeStyle='#9a3a2a';ctx.lineWidth=2;ctx.fillRect(p.x-8,p.y+bob-14,16,28);ctx.strokeRect(p.x-8,p.y+bob-14,16,28);ctx.fillStyle='#9a3a2a';ctx.font='bold 13px KaiTi';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('符',p.x,p.y+bob+1); }
  });
  if(st==='play'||st==='dead'){
    ctx.save(); ctx.translate(rabbit.x,rabbit.y); ctx.rotate(rabbit.rot);
    if(invincible>0&&(invincible%8<4))ctx.globalAlpha=0.4;
    if(rabbit.shield){ctx.strokeStyle='rgba(232,192,64,'+(0.5+0.3*Math.sin(performance.now()*0.008))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,RR+7,0,6.2832);ctx.stroke();}
    const lean=Math.max(-0.5,Math.min(0.5,-rabbit.v*0.05));
    ctx.fillStyle='#d8cfc0';ctx.strokeStyle='#3a3228';ctx.lineWidth=1.5;
    for(const s of[-1,1]){
      ctx.save();ctx.translate(s*6,-RR+2);ctx.rotate(lean*s*0.6+s*0.25);
      ctx.beginPath();ctx.ellipse(0,-13,5.5,14,0,0,6.2832);ctx.fill();ctx.stroke();
      ctx.fillStyle='#b08878';ctx.beginPath();ctx.ellipse(0,-13,2.5,9,0,0,6.2832);ctx.fill();ctx.fillStyle='#d8cfc0';
      ctx.restore();
    }
    const bg=ctx.createRadialGradient(-3,-3,2,0,0,RR+2); bg.addColorStop(0,'#f5f0e8');bg.addColorStop(1,'#c8bfb0');
    ctx.fillStyle=bg; ctx.beginPath();ctx.arc(0,0,RR,0,6.2832);ctx.fill();ctx.strokeStyle='#3a3228';ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle='#2a1a14';ctx.beginPath();ctx.arc(6,-3,2.1,0,6.2832);ctx.fill();
    ctx.fillStyle='#b0605a';ctx.beginPath();ctx.arc(11,2,1.8,0,6.2832);ctx.fill();
    ctx.fillStyle='#f5f0e8';ctx.beginPath();ctx.arc(-RR+2,4,4.5,0,6.2832);ctx.fill();ctx.stroke();
    ctx.restore();
  }
    particles.forEach(q=>{ctx.globalAlpha=Math.min(1,q.life/22);ctx.fillStyle=q.col;if(q.txt){ctx.font='bold 16px KaiTi';ctx.textAlign='center';ctx.fillText(q.txt,q.x,q.y);}else{ctx.beginPath();ctx.arc(q.x,q.y,q.r||3,0,6.2832);ctx.fill();}});
  ctx.globalAlpha=1;
  ctx.restore();
}
let last=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/16.667,2.5); last=now;
  if(st==='play')update(dt,now);
  else if(st==='dead'){ for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;if(!q.txt)q.vy+=0.12;q.life--;if(q.life<=0)particles.splice(i,1);} if(shake>0)shake--; }
  draw();
}
requestAnimationFrame(loop);
function jump(){ if(st==='play'){ rabbit.v=JUMP; sfx.jump(); puff(rabbit.x-10,rabbit.y+6,'#f5f0e8',3); } }
function tap(e){ if(st==='pause'){resume();e&&e.preventDefault&&e.preventDefault();return;} if(st==='menu'||st==='dead')return; jump(); e&&e.preventDefault&&e.preventDefault(); }
cvs.addEventListener('mousedown',tap);
cvs.addEventListener('touchstart',tap,{passive:false});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); if(st==='menu')startGame(); else if(st==='dead')retry(); else if(st==='pause')resume(); else jump(); } });
function startGame(){ reset(); st='play'; startScreen.style.display='none'; overScreen.style.display='none'; hud.style.display='flex'; spawnBamboo(); }
function pauseGame(){ if(st!=='play')return; st='pause'; comboEl.textContent='暂 停 · 点击继续'; comboEl.classList.add('show'); }
function resume(){ if(st!=='pause')return; st='play'; comboEl.classList.remove('show'); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden)pauseGame(); });
function showOver(){
  hud.style.display='none';
  const isBest=score>best&&score>0;
  if(isBest){best=score;saveBest(best);$('startBest').textContent='最高分 '+best;}
  $('overStats').innerHTML=(isBest?'<span style="color:#e8c040;letter-spacing:4px">✦ 新 纪 录 ✦</span><br>':'')+'本次 <b style="color:#e8c040">'+score+'</b> 分<br>最高 '+best;
  overScreen.style.display='flex';
}
function retry(){ overScreen.style.display='none'; startGame(); }
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',retry);
function fit(){ const s=Math.min(innerWidth/W,innerHeight/H); cvs.style.width=(W*s)+'px'; cvs.style.height=(H*s)+'px'; }
addEventListener('resize',fit); fit();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__motu={ get state(){return st}, get score(){return score}, get best(){return best}, jump(){ if(st==='play')jump(); else if(st==='menu')startGame(); } };
})();
</script>
</body>
</html>
