<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="墨兔冲关">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-152.png">
<title>墨兔冲关 v1.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e0c0a;font-family:'KaiTi','STKaiti',serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.7)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
#startScreen{background:radial-gradient(ellipse at center,rgba(20,16,10,.92),rgba(6,4,3,.97));pointer-events:auto}
#startScreen h1{font-size:min(13vw,54px);color:#c8a870;letter-spacing:14px;margin:0 0 4px;text-shadow:0 0 28px rgba(200,168,112,.5),0 3px 0 rgba(0,0,0,.6)}
.sub{font-size:12px;color:#8b7355;letter-spacing:5px;margin-bottom:20px}
.best-txt{font-size:15px;color:#d4c5a0;margin-bottom:20px;letter-spacing:2px}
.btn{padding:12px 42px;background:linear-gradient(180deg,#3a1e10,#2a140a);border:1px solid #8b1a1a;color:#c8a870;font:18px 'KaiTi',serif;letter-spacing:8px;cursor:pointer;border-radius:4px;box-shadow:0 0 18px rgba(139,26,26,.35);transition:filter .2s}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:scale(.96)}
.howto{margin-top:24px;font-size:11px;color:#6a5a3a;letter-spacing:3px;line-height:2.4;text-align:center;max-width:340px}
#overScreen{background:rgba(8,6,4,.9);pointer-events:auto;display:none;backdrop-filter:blur(4px)}
#overScreen h2{font-size:34px;color:#8b1a1a;letter-spacing:10px;margin:0 0 14px;text-shadow:0 0 20px rgba(139,26,26,.5)}
#overScreen .st{font-size:17px;color:#d4c5a0;line-height:2;text-align:center;margin-bottom:20px;letter-spacing:2px}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;z-index:4;pointer-events:none}
#hud .l{font-size:24px;color:#f5f0e8;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#hud .r{font-size:14px;color:#c8a870;align-self:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#combo{position:absolute;top:68px;left:0;right:0;text-align:center;font:24px/1.4 'KaiTi',serif;color:#e8c040;letter-spacing:5px;opacity:0;transition:opacity .3s;z-index:4;pointer-events:none;text-shadow:0 0 8px rgba(232,192,64,.4);filter:blur(1px)}
#combo.show{opacity:1}
#combo.skill-ready{color:#ff6b4a;font-size:28px;text-shadow:0 0 16px rgba(255,107,74,.7);filter:none}
/* P234: 连击书法笔势 —— 飘散墨点飞白 */
#combo::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border:1px dashed rgba(255,240,180,.15);border-radius:10px;z-index:-1}
@keyframes brushDrip{0%{transform:scale(.98) skew(-1deg)}50%{transform:scale(1.02) skew(1deg)}100%{transform:scale(.98) skew(-1deg)}}
#combo.show{animation:brushDrip .4s ease-out 2 forwards}
#flash{position:absolute;inset:0;background:rgba(255,80,20,.18);opacity:0;transition:opacity .08s;pointer-events:none;z-index:3}
#flash.on{opacity:1}
.new-best{color:#e8c040 !important;animation:glow .8s infinite alternate}
@keyframes glow{from{text-shadow:0 0 8px rgba(232,192,64,.4)}to{text-shadow:0 0 20px rgba(232,192,64,.9)}}
/* P222: 图鉴 */
#guideBtn{position:absolute;top:10px;right:12px;z-index:6;width:36px;height:36px;border-radius:50%;background:rgba(20,14,8,.6);border:1px solid rgba(200,168,112,.4);color:#c8a870;font:17px 'KaiTi',serif;cursor:pointer;line-height:34px;text-align:center;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#guideBtn.on{display:block}
.guide-list{max-height:52vh;overflow-y:auto;padding:0 18px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.gi{display:flex;align-items:center;gap:12px;background:rgba(245,240,232,.05);border:1px solid rgba(200,168,112,.15);border-radius:6px;padding:8px 12px}
.gi div{display:flex;flex-direction:column;gap:2px;text-align:left}
.gi b{font-size:15px;letter-spacing:2px}
.gi span{font-size:11px;color:#8b7355;letter-spacing:1px;line-height:1.5}
.gic{background:rgba(10,14,10,.5);border-radius:50%;flex:0 0 34px}
#guideClose{margin-top:16px}
</style>
</head>
<body>
<div id="wrap">
<!-- P222: 道具图鉴入口 -->
<button id="guideBtn" title="道具图鉴">图</button>
  <canvas id="c" width="420" height="680"></canvas>
  <div id="flash"></div>
  <div id="hud" style="display:none">
    <div class="l" id="scoreTxt">0</div>
    <div class="r">
      <span id="skillLbl">技</span><span id="seasonLbl" style="font-size:12px;color:#d4c5a0">春</span><span id="hudShield" style="font-size:13px;color:#e8c040;min-width:18px;text-align:right"></span>
      <div style="width:70px;height:5px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:2px;overflow:hidden;border:1px solid rgba(200,168,112,.3)">
        <div id="skillBar" style="width:0%;height:100%;background:linear-gradient(90deg,#c8a870,#e8c040);border-radius:2px;transition:width .2s"></div>
      </div>
      <span id="bestTxt">最高 0</span>
    </div>
  </div>
  <div id="combo"></div>
  <div class="layer" id="startScreen">
    <h1>墨 兔 冲 关</h1>
    <div class="sub">— 竹 海 穿 行 · 墨 点 收 缘 —</div>
    <div class="best-txt" id="startBest"></div>
    <button class="btn" id="startBtn">入 林</button>
    <div class="howto">点击/空格 — 跳跃<br>金元宝(分) · 墨珠(连击) · 符纸(护身) · 灵草(技) · 萝卜(速)<br>竹林渐密 竹息渐急 · 攒满技能条可爆气</div>
  </div>
  <div class="layer" id="overScreen">
    <h2>兔 落 竹 深</h2>
    <div class="st" id="overStats"></div>
    <button class="btn" id="retryBtn">再 闯</button>
  </div>
  <!-- P222: 道具图鉴 — 首次玩家必看 -->
  <div class="layer" id="guideScreen" style="display:none;background:rgba(8,6,4,.96);pointer-events:auto;z-index:9">
    <h2 style="color:#c8a870;letter-spacing:8px;font-size:26px;margin:0 0 12px">道 具 图 鉴</h2>
    <div class="guide-list">
      <div class="gi"><canvas class="gic" data-k="coin" width="34" height="34"></canvas><div><b style="color:#e8c040">铜钱</b><span>加分 · 连拾加成</span></div></div>
      <div class="gi"><canvas class="gic" data-k="pearl" width="34" height="34"></canvas><div><b style="color:#8b9dc0">墨珠</b><span>+5分 · 连击+3 · 技能+8</span></div></div>
      <div class="gi"><canvas class="gic" data-k="shield" width="34" height="34"></canvas><div><b style="color:#c8705a">符纸</b><span>护身1层(最多叠3) · 撞竹挡1伤</span></div></div>
      <div class="gi"><canvas class="gic" data-k="radish" width="34" height="34"></canvas><div><b style="color:#e8553a">萝卜</b><span>冲刺加速1.5秒</span></div></div>
      <div class="gi"><canvas class="gic" data-k="herb" width="34" height="34"></canvas><div><b style="color:#5ab86a">灵草</b><span>技能+20 · 附1层符 · 短暂无敌</span></div></div>
      <div class="gi"><canvas class="gic" data-k="burst" width="34" height="34"></canvas><div><b style="color:#ff6b4a">爆气</b><span>技槽满后点击屏幕 · 无敌加速</span></div></div>
    </div>
    <div style="font-size:11px;color:#6a5a3a;letter-spacing:2px;margin:10px 0">节气四变 · 十五连击墨韵爆发 · 廿五分道童祝福</div>
    <button class="btn" id="guideClose">知 道 了</button>
  </div>
</div>
<script>
(() => {
'use strict';
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=420,H=680;
// P223: 高清渲染 — backing store 按 devicePixelRatio 放大，CSS 尺寸不变，画面不再糊
let DPR=Math.min(window.devicePixelRatio||1,2.5);
cvs.width=W*DPR;cvs.height=H*DPR;
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
const $=id=>document.getElementById(id);
const scoreTxt=$('scoreTxt'),bestTxt=$('bestTxt'),comboEl=$('combo'),hud=$('hud');
const flashEl=$('flash'),skillBar=$('skillBar'),skillLbl=$('skillLbl');
const hudShield=$('hudShield');
const startScreen=$('startScreen'),overScreen=$('overScreen');

const SAVE_KEY='motu_v1';
function loadBest(){ try{return +localStorage.getItem(SAVE_KEY)||0}catch(_){return 0} }
function saveBest(v){ try{localStorage.setItem(SAVE_KEY,v)}catch(_){} }
let best=loadBest();
$('startBest').textContent=best?('最高分 '+best):'';

// ============ 音效 ============
let AC=null;
function beep(f,d,t,v){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(_){}};
const sfx={
  jump:()=>{beep(392,.1,'triangle',.08);beep(523,.1,'triangle',.05)},
  coin:()=>{beep(880,.08,'square',.05);beep(1175,.12,'square',.05)},
  pearl:()=>{beep(660,.15,'sine',.08)},
  herb:()=>{beep(523,.1,'sine',.06);beep(784,.15,'sine',.07)},
  burst:()=>{beep(200,.25,'sawtooth',.12);beep(400,.2,'square',.08);beep(800,.35,'sine',.06)},
  die:()=>{beep(220,.25,'sawtooth',.1);beep(110,.4,'sawtooth',.1)},
  pass:()=>{beep(494,.06,'sine',.05)},
  skill:()=>{beep(660,.1,'triangle',.08);beep(880,.15,'triangle',.1);beep(1320,.25,'sine',.07)}
};

// ============ 状态 ============
let st='menu';
let rabbit={x:90,y:H*0.42,v:0,rot:0,shield:0};
let bamboo=[],pickups=[],particles=[],clouds=[],stars=[],fireflies=[],lanterns=[],seasonParts=[],trail=[],shockwaves=[];
let score=0,lastSpawn=0,shake=0,dayPhase=0,invincible=0,frame=0;
let comboN=0,comboTimer=0,skillMeter=0,burstTimer=0,perfectStreak=0; // P238③: 连续完美跳跃计数
let gameSpeed=1,speedBurst=0;
let __eyeBoost=0; // P229: 兔子瞳孔放大系数（吃币/珍珠瞬间触发）
let dangerLevel=0; // P238: 危险红晕累积度（0-1）
// P217: 节气系统 v1.7 — 每40分换季，特效粒子+季节玩法
const SEASONS=[
  {name:'春',part:'petal',pc:'#f0a8b8',sky:['#c8d8c0','#e8dfe8']},
  {name:'夏',part:'rain', pc:'#7898b8',sky:['#a8c8b8','#d8e0c8']},
  {name:'秋',part:'leaf', pc:'#d88a3a',sky:['#d8b890','#e8d0a8']},
  {name:'冬',part:'snow', pc:'#f0f0f8',sky:['#b8c0cc','#dce0e8']}
];
let season=0,blessTimer=0;
let seasonSplash=null; // P240: 季节转场水墨横扫
const G=0.40,JUMP=-9.0,RR=13; // P246: 减重力+提跳力——上升更轻快(顶点94px/22帧)，解决"跳跃沉重"
const SKILL_MAX=100;
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}

function reset(){
  rabbit={x:90,y:H*0.42,v:0,rot:0,shield:0,jumps:0};
  bamboo=[];pickups=[];particles=[];clouds=[];
  stars=[];fireflies=[];lanterns=[];
  for(let i=0;i<4;i++) clouds.push({x:Math.random()*W,y:40+Math.random()*160,s:.15+Math.random()*.2,w:60+Math.random()*80});
  for(let i=0;i<30;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.55,tw:Math.random()*6.28,s:0.4+Math.random()*1.2});
  for(let i=0;i<8;i++) fireflies.push({x:Math.random()*W,y:60+Math.random()*260,ph:Math.random()*6.28,s:0.3+Math.random()*0.8,r:1.5+Math.random()*2});
  score=0;lastSpawn=0;shake=0;dayPhase=0;invincible=0;frame=0;comboN=0;comboTimer=0;perfectStreak=0;skillMeter=0;burstTimer=0;gameSpeed=1;speedBurst=0;__craneAt=0;dangerLevel=0;
  season=0;seasonParts=[];blessTimer=0;trail=[];
  menuBamboo=[];menuSparkles=[];__menuTick=0;inkTrail=[];magLines=[];   // P225: 清理菜单装饰+墨迹+磁铁线
  deathInkPoints=[];ghostTrail=[];ripples=[];doomBloom=null;coinRain=null;crane=null;   // P235: 清理死亡墨画+残影+涟漪
  scoreTxt.textContent='0';bestTxt.textContent='最高 '+best;skillBar.style.width='0%';skillLbl.style.color='#c8a870';skillLbl.textContent='技';hudShield.textContent='';
  skillBar.style.background='linear-gradient(90deg,#c8a870,#e8c040)';
}
function diff(){
  const d=Math.min(score,80);
  let spd=3.4+d*.085;   // P223: 提回流畅速度（旧2.1+0.048太肉）
  if(speedBurst>0) spd*=1.35;
  spd*=gameSpeed;
  // P223: 季节系数不再拖速度——春加速、其余中性、冬微快(结冰打滑感)
  const se=SEASONS[season];
  if(se.name==='春')spd*=1.08;
  else if(se.name==='冬')spd*=1.05;
  return {speed:spd,gap:Math.max(145,195-d*1.15),interval:Math.max(120,158-d*.9)};
}
function hasShield(){return rabbit&&rabbit.shield>0}

function takeHit(){
  if(burstTimer>0||invincible>0)return true;
  if(hasShield()){
    rabbit.shield--;               // P221: 叠层护盾逐层消耗
    invincible=120;              // P216: 护盾触发给 2 秒无敌，足够穿过整根竹子
    rabbit.v=-6.2;               // P216: 反弹跳起，脱离碰撞区
    sfx.pearl();vib(20);
    puff(rabbit.x,rabbit.y,'#e8c040',14);
    showCombo('符纸挡伤·剩'+(rabbit.shield>0?rabbit.shield:'0')+'层');
    return true;
  }
  return false;
}

// ============ 生成 ============
function spawnBamboo(){
  const D=diff();
  const gapY=Math.max(60, Math.min(H-100, H*0.38+Math.random()*(H*0.22-D.gap)));
  // 最小缝宽保障——确保纯技术可过
  const minGap=110;
  const isDouble=score>=25 && Math.random()<Math.min(.18,(score-25)*0.006);
  if(isDouble){
    const subGap=Math.max(minGap, 88+Math.random()*70);
    const subY=Math.max(120, Math.min(H-120, gapY+Math.random()*40));
    bamboo.push({x:W+40,w:52,gapY:subY-subGap/2,gap:subGap,passed:false,move:false,ph:Math.random()*6.28,twin:true});
    bamboo.push({x:W+40+90,w:52,gapY:subY+subGap/2+subGap,gap:subGap,passed:false,move:false,ph:Math.random()*6.28,twin:true});
  } else {
    const isNeedle=score>=30 && Math.random()<.10;
    const ngap=Math.max(minGap, isNeedle? D.gap*.72 : D.gap);
    bamboo.push({x:W+40,w:52,gapY:gapY+D.gap/2,gap:ngap,passed:false,move:false,ph:Math.random()*6.28,twin:false,needle:isNeedle});
  }
  if(score%40===39 && dayPhase>.55){
    for(let i=0;i<5;i++)lanterns.push({x:W+20+Math.random()*80,y:H+10+Math.random()*60,ph:Math.random()*6.28});
  }
  if(st==='play'){
    const stalk=bamboo[bamboo.length-1];
    const half=Math.max(14, stalk.gap/2-20);
    const safeY= y=>Math.max(-half, Math.min(half,y));
    const forced=['shield','herb','radish'][Math.min(score,2)];
    if(score<3 && forced){
      pickups.push({x:stalk.x+stalk.w/2, y:stalk.gapY, off:0, ref:stalk, kind:forced, ph:Math.random()*6});
    } else if(score>=3 && stalk.gap>=minGap && !stalk.twin){
      const r=Math.random();
      if(r<.35){
        // 经典三连铜钱：同一高度，横向排成一串，避免叠一起
        const baseY=stalk.gapY;
        const baseX=stalk.x+stalk.w/2;
        pickups.push({x:baseX-28, y:baseY, off:0, ref:stalk, kind:'coin', ph:Math.random()*6});
        pickups.push({x:baseX,     y:baseY, off:0, ref:stalk, kind:'coin', ph:Math.random()*6});
        pickups.push({x:baseX+28, y:baseY, off:0, ref:stalk, kind:'coin', ph:Math.random()*6});
      } else if(r<.55){
        pickups.push({x:stalk.x+stalk.w/2, y:stalk.gapY+safeY(-30), off:0, ref:stalk, kind:'pearl', ph:Math.random()*6});
      } else if(r<.75){
        pickups.push({x:stalk.x+stalk.w/2, y:stalk.gapY, off:0, ref:stalk, kind:'shield', ph:Math.random()*6});
      } else {
        pickups.push({x:stalk.x+stalk.w/2, y:stalk.gapY+safeY(-22), off:0, ref:stalk, kind:'radish', ph:Math.random()*6});
      }
    }
  }
}

// ============ 更新 ============
// P223: 物理改为 dt 驱动（dt=本帧耗时/16.667ms，钳制2.5防跳帧）——帧率波动不再影响速度
function update(dt,now){
  const D=diff();
  frame+=dt;   // 全局帧计数，供动画/节气等依赖
  // P225: 墨迹轨迹（兔子移动时持续输出脚印）
  pushInkTrail();
  // P230: 跳跃残影（每帧记录）
  pushGhost();
  // P225: 磁铁道具效果——若兔子在币群密集区，自动把币吸过来
  if(st==='play'){
    for(let i=pickups.length-1;i>=0;i--){
      const p=pickups[i];
      if(p.kind==='coin'||p.kind==='pearl'){
        const dx=rabbit.x-p.x,dy=rabbit.y-p.y;
        const d2=dx*dx+dy*dy;
        if(d2<32400&&Math.random()<.32){ // 360px 内 32% 吸近一步
          addMagLine(p.x,p.y,rabbit.x,rabbit.y);
          p.x+=dx*.08; p.y+=dy*.08;
        }
      }
    }
  }
  if(burstTimer>0){
    burstTimer-=dt;
    if(burstTimer<=0){burstTimer=0;invincible=0;skillLbl.style.color='#c8a870';skillLbl.textContent='技';}
  }
  if(speedBurst>0){speedBurst-=dt;if(speedBurst<0)speedBurst=0;}
  if(doubleCoinTimer>0)doubleCoinTimer-=dt;
  if(lowGravTimer>0)lowGravTimer-=dt;
  const __pv=rabbit.v;
  rabbit.v+=(lowGravTimer>0?G*0.5:G)*dt;rabbit.y+=rabbit.v*dt;
  // P230: 跳跃顶点（v由负转正）放墨圈+小墨点，强化跳跃手感
  if(__pv<0&&rabbit.v>=0&&rabbit.y<H-40){
    ripple(rabbit.x,rabbit.y,'rgba(140,130,120,.5)');
    puff(rabbit.x,rabbit.y,'#4a453f',3);
  }
  rabbit.rot=Math.max(-.5,Math.min(1.1,rabbit.v*.06));
  if(rabbit.y<RR){rabbit.y=RR;rabbit.v=0;}
  if(rabbit.y>H-RR){
    // P228: 落地墨点涟漪 —— 首次着地（此前在空中）才触发
    if(!rabbit.onGround){rabbit.onGround=true;ripple(rabbit.x,H-RR+4,'rgba(60,60,65,.5)');}
    rabbit.y=H-RR;
    // P231: 落地重置双跳计数
    rabbit.jumps=0;
    if(!takeHit()){hit();return;}
    rabbit.v=-3.2; // P215: 护盾/无敌触发后弹离底部，避免下一帧重复撞击
    rabbit.onGround=false;
  } else if(rabbit.y<H-RR||rabbit.v<0){rabbit.onGround=false;}
  lastSpawn+=D.speed*dt;
  if(lastSpawn>D.interval+60){lastSpawn=0;spawnBamboo();}
  for(let i=bamboo.length-1;i>=0;i--){

function drawDoomBloom(){

  const colors=doomBloom.burst?['#ff6b4a','#ff9a3a','#ffd76a']:'#2a2a2a';
  for(const pt of doomBloom.petals){

      ctx.fillStyle=grad;

function drawDeathInk(){

  for(let i=deathInkPoints.length-1;i>=0;i--){

    g.addColorStop(0,d.col);g.addColorStop(.6,'rgba(60,58,55,'+(1-k)*.4+')');g.addColorStop(1,'rgba(60,58,55,0)');

let paperTex=null,paperPat=null,vig=null;
function makePaperTex(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),id=x.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){const v=200+Math.random()*55;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=Math.random()*22;}

}
function ensureAtmos(){

  if(!vig){vig=ctx.createRadialGradient(W*.5,H*.45,H*.32,W*.5,H*.5,H*.78);
    vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(.75,'rgba(10,8,5,.14)');vig.addColorStop(1,'rgba(8,6,3,.4)');}
}
function drawAmbience(){

  ctx.save();ctx.globalAlpha=.045;ctx.fillStyle=paperPat;ctx.fillRect(-20,-20,W+40,H+40);ctx.restore();

// ============ 游戏循环 ============
let last=0;
// P223b: 性能自适应 — FPS低自动降DPR/砍特效，保流畅优先（老板铁律）
let __fFrames=0,__fT0=0,__tier=(window.devicePixelRatio||1)>=2?2:1; // 2=全效果 1=无DPR 0=降DPR0.75+关氛围
let atmosOn=true;
function setAtmosOn(v){atmosOn=v;}
function applyTier(){
  const cap=({2:Math.min(window.devicePixelRatio||1,2.5),1:1,0:0.75})[__tier]||1;
  DPR=Math.min(window.devicePixelRatio||1,cap);
  const bw=Math.round(W*DPR),bh=Math.round(H*DPR);
  if(cvs.width!==bw||cvs.height!==bh){cvs.width=bw;cvs.height=bh;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  paperTex=null;paperPat=null;vig=null;farBambooSpr=null;bambooTileSpr=null; // sprite按DPR重建
  const s=Math.min(innerWidth/W,innerHeight/H);
  cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';
  if(__tier<=0)setAtmosOn(false);
}
function perfTick(now){
  __fFrames++;
  if(!__fT0){__fT0=now;return;}
  const el=now-__fT0;
  if(el>=1500){
    const fps=__fFrames*1000/el;
    if(fps<42&&__tier>0){__tier--;applyTier();}
    else if(fps<30&&__tier===1){__tier=0;applyTier();}
    __fFrames=0;__fT0=now;
  }
}
function loop(now){
  requestAnimationFrame(loop);
  perfTick(now);
  const dt=Math.min((now-last)/16.667,2.5);last=now;
  if(st==='menu'){
    frame += dt*60;
    // P224: 整数计数器 spawn 装饰竹，避免浮点%精度漏触发
    __menuTick += dt*60;
    if(__menuTick>=50){__menuTick=0;spawnMenuBamboo(now);}
    for(let i=menuSparkles.length-1;i>=0;i--){const s=menuSparkles[i];s.life-=dt;if(s.life<=0)menuSparkles.splice(i,1);}
  }
  // 云朵统一在此移动（play/menu/dead 都动）
  clouds.forEach(c=>{c.x-=c.s*dt;if(c.x<-c.w)c.x=W+c.w;});
  // P224: 菜单态装饰竹子左移
  menuBamboo.forEach(b=>{b.x-=b.speed*dt;});
  menuBamboo=menuBamboo.filter(b=>b.x>-100);
  // play/dead 进入更新
  if(st==='play'){update(dt,now);}
  else if(st==='dead'){for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.txt)q.vy+=.12*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1);}if(shake>0)shake=Math.max(0,shake-dt);}
  draw();
}
requestAnimationFrame(loop);

// ============ 输入 ============
function jump(){
  if(st!=='play')return;
  if(skillMeter>=SKILL_MAX&&burstTimer<=0){activateBurst();return;}
  const airTime=frame-(rabbit.lastJumpFrame||-999);
  // P246: 纯flappy手感——每次点击满跳、零冷却（旧5帧冷却+85折弱跳是"沉重感"来源）
  rabbit.lastJumpFrame=frame;
  rabbit.v=JUMP;
  rabbit.justJumped=true;
  if(airTime<16){rabbit.isAirJump=true;setTimeout(()=>rabbit.isAirJump=false,120);puff(rabbit.x-8,rabbit.y+8,'#8a7f70',5);ripple(rabbit.x,rabbit.y+6,'rgba(150,140,125,.45)');}
  sfx.jump();puff(rabbit.x-10,rabbit.y+6,'#f5f0e8',3);
}
function tap(e){
  if(st==='pause'){resume();e&&e.preventDefault&&e.preventDefault();return;}
  if(st==='menu'||st==='dead')return;
  // P236: 双击疾走（第二击不再跳）
  if(tryDoubleTap()){e&&e.preventDefault&&e.preventDefault();return;}
  jump();e&&e.preventDefault&&e.preventDefault();
}
cvs.addEventListener('mousedown',tap);
cvs.addEventListener('touchstart',tap,{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(st==='menu')startGame();
    else if(st==='dead')retry();
    else if(st==='pause')resume();
    else jump();
  }
  if(e.code==='KeyS'&&st==='play')activateBurst();
});

// ============ 流程控制 ============
function startGame(){
  reset();
  st='play';
  // P225: 开局 2 秒无敌，给玩家适应新节奏 & 防首屏撞亡
  invincible=120;
  startScreen.style.display='none';overScreen.style.display='none';hud.style.display='flex';
  spawnBamboo();
}
function pauseGame(){if(st!=='play')return;st='pause';comboEl.textContent='暂 停 · 点击继续';comboEl.classList.add('show');}
function resume(){if(st!=='pause')return;st='play';comboEl.classList.remove('show');comboEl.textContent='';}
// P236: 双击加速 —— 400ms内两次点按触发3秒疾走
let lastTapT=0;
function tryDoubleTap(){
  const now=performance.now();
  if(now-lastTapT<400&&st==='play'&&speedBurst<=0){
    speedBurst=180;showCombo('⚡ 疾 走 ⚡');sfx.burst();vib([20,20,40]);
    for(let i=0;i<10;i++)puff(rabbit.x-14,rabbit.y+(Math.random()*30-15),'#e8e0c8',1);
    lastTapT=0;return true;
  }
  lastTapT=now;return false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});

// ============ P222: 道具图鉴 ============
const guideScreen=$('guideScreen'),guideBtn=$('guideBtn');

  document.querySelectorAll('.gic').forEach(cv=>{
    const g=cv.getContext('2d'),k=cv.dataset.k;g.clearRect(0,0,34,34);g.save();g.translate(17,17);
    if(k==='coin'){const cg=g.createRadialGradient(-3,-3,1,0,0,10);cg.addColorStop(0,'#ffe89a');cg.addColorStop(.6,'#e8c040');cg.addColorStop(1,'#9a7a1a');g.fillStyle=cg;g.beginPath();g.arc(0,0,9,0,6.28);g.fill();g.strokeStyle='#7a5a10';g.lineWidth=1.5;g.stroke();g.fillStyle='rgba(60,40,5,.85)';g.fillRect(-2.5,-2.5,5,5);}
    else if(k==='pearl'){const pg=g.createRadialGradient(-4,-4,1,0,0,11);pg.addColorStop(0,'#6b7488');pg.addColorStop(.5,'#2a2f3a');pg.addColorStop(1,'#12151c');g.fillStyle=pg;g.beginPath();g.arc(0,0,10,0,6.28);g.fill();g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(-3.5,-3.5,2.6,0,6.28);g.fill();}
    else if(k==='shield'){const sg=g.createLinearGradient(-8,-14,8,14);sg.addColorStop(0,'#faf5e6');sg.addColorStop(.5,'#f2e6c8');sg.addColorStop(1,'#ddceaa');g.fillStyle=sg;g.fillRect(-8,-14,16,28);g.strokeStyle='#9a3a2a';g.lineWidth=1.8;g.strokeRect(-8,-14,16,28);g.fillStyle='#9a3a2a';g.font='bold 13px KaiTi';g.textAlign='center';g.textBaseline='middle';g.fillText('符',0,0);}
    else if(k==='radish'){g.fillStyle='#d94a3a';g.beginPath();g.ellipse(0,2,7,11,0,0,6.28);g.fill();g.fillStyle='#2d7a3a';g.beginPath();g.moveTo(0,-9);g.lineTo(2,-17);g.lineTo(-1,-9);g.fill();g.fillStyle='#f5f0e8';g.fillRect(-3,9,6,4);}
    else if(k==='herb'){g.fillStyle='#e8c040';g.strokeStyle='#8b6a1a';g.lineWidth=1.5;g.beginPath();g.arc(0,0,8,0,6.28);g.fill();g.stroke();g.fillStyle='#5ab86a';g.font='bold 9px KaiTi';g.textAlign='center';g.textBaseline='middle';g.fillText('草',0,1);}
    else if(k==='burst'){const bg=g.createRadialGradient(0,0,2,0,0,12);bg.addColorStop(0,'#ffd766');bg.addColorStop(.5,'#ff9a3a');bg.addColorStop(1,'rgba(255,80,20,0)');g.fillStyle=bg;g.beginPath();g.arc(0,0,12,0,6.28);g.fill();g.fillStyle='#fff2cc';g.font='bold 11px KaiTi';g.textAlign='center';g.textBaseline='middle';g.fillText('爆',0,1);}
    g.restore();

function openGuide(){guideScreen.style.display='flex';drawGuideIcons();}
function closeGuide(){guideScreen.style.display='none';}
guideBtn.addEventListener('click',e=>{e.stopPropagation();openGuide();});

if(!localStorage.getItem(SAVE_KEY+'_g')){setTimeout(()=>{guideScreen.style.display='flex';drawGuideIcons();try{localStorage.setItem(SAVE_KEY+'_g','1')}catch(_){}},600);}

function showOver(){
  hud.style.display='none';
  const isBest=score>best&&score>0;
  if(isBest){
    best=score;saveBest(best);$('startBest').textContent='最高分 '+best;
    newBestScore=score;newBestFrame=0; // P236: 纪录星光
  }
  const skillPct=Math.round((skillMeter/SKILL_MAX)*100);
  $('overStats').innerHTML=(isBest?'<span class="new-best" style="color:#e8c040;letter-spacing:4px">✦ 新 纪 录 ✦</span><br>':'')+
    '本次 <b style="color:#e8c040">'+score+'</b> 分<br>最高 '+best+'<br>技能蓄积 '+skillPct+'%';
  overScreen.style.display='flex';
}
// P236: 纪录星光 —— 死亡后若是新最高分，屏幕撒金箔/星光缓缓飘落
let newBestScore=0,newBestFrame=0,newBestStars=[];
function drawNewBestStars(){
  if(!newBestScore)return;
  if(newBestFrame===0){ // 初始化星星
    for(let i=0;i<30;i++){
      const ang=Math.random()*6.2832,r=30+Math.random()*80;
      newBestStars.push({
        x:W/2+Math.cos(ang)*r,y:H/2+Math.sin(ang)*r,
        vx:Math.random()*2-1,vy:Math.random()*.5-0.3,
        life:180+Math.random()*120,scale:.5+Math.random()*.5,rot:Math.random()*6.2832});
    }
  }
  newBestFrame++;
  const prog=Math.min(1,newBestFrame/300);
  for(let i=newBestStars.length-1;i>=0;i--){
    const s=newBestStars[i];
    s.x+=s.vx;s.y+=s.vy+(s.vy*.3);
    s.rot+=.08;s.life--;
    const a=Math.max(0,prog-.7)*.6+.4;
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.rot);
    ctx.globalAlpha=a*Math.min(1,s.life/180);
    ctx.fillStyle='#f5c040';
    ctx.beginPath();ctx.arc(0,0,2*s.scale,0,6.2832);ctx.fill();
    // 金箔边框
    ctx.strokeStyle='rgba(245,220,140,'+(1-s.life/180)+')';
    ctx.lineWidth=1;s.scale>1.2&&ctx.stroke();
    ctx.restore();
    if(s.life<=0){
      newBestStars.splice(i,1);newBestScore=0;
    }
  }
}
function retry(){overScreen.style.display='none';startGame();}
$('startBtn').addEventListener('click',startGame);
$('startBtn').addEventListener('touchstart',(e)=>{e.stopPropagation();e.preventDefault();startGame();},false);
$('retryBtn').addEventListener('click',retry);

// P223: fit 同步 DPR — 高分屏清晰，且窗口变化时重建 backing store
function fit(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const bw=Math.round(W*DPR),bh=Math.round(H*DPR);
  if(cvs.width!==bw||cvs.height!==bh){cvs.width=bw;cvs.height=bh;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  paperPat=null;vig=null; // DPR变后缓存失效，重建
  const s=Math.min(innerWidth/W,innerHeight/H);
  cvs.style.width=(W*s)+'px';cvs.style.height=(H*s)+'px';
}
addEventListener('resize',fit);fit();

})();
